<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Cofrinho em Família{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="topo"><a class="marca" href="{{ url_for('index') }}">🐷 Cofrinho em Família</a><nav><a href="{{ url_for('index') }}">Início</a><a href="{{ url_for('responsavel') }}">Responsável</a></nav></header><main class="container">{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="alerta {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Moedas virtuais para educação financeira. Nenhum dinheiro real é movimentado.</footer><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
